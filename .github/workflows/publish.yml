name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - run: npm run check

      - name: Publish unpublished version
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
          fi
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.npm.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.npm.outputs.version }}"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "GitHub Release v$version already exists"
            exit 0
          fi
          gh release create "v$version" --title "v$version" --generate-notes --target "$GITHUB_SHA"
